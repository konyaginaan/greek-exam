<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Греческий Б1 — Диалоги</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e0f;
  --surface: #161618;
  --surface2: #1e1e21;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #f0ede8;
  --muted: rgba(240,237,232,0.45);
  --accent: #c8f060;
  --accent2: #60d4f0;
  --accent3: #f060b0;
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Manrope', sans-serif; font-size: 15px; line-height: 1.65; min-height: 100vh; overflow-x: hidden; padding-top: 64px; }
body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(200,240,96,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(200,240,96,0.03) 1px, transparent 1px); background-size: 48px 48px; pointer-events: none; z-index: 0; }
.container { max-width: 1100px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }
.social-link { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 5px 13px; border-radius: 40px; border: 1px solid; text-decoration: none; letter-spacing: .03em; transition: opacity .15s; white-space: nowrap; }
.social-link:hover { opacity: .72; }
.social-link.tg { border-color: rgba(96,212,240,.45); color: var(--accent2); }
.social-link.yt { border-color: rgba(240,80,80,.45); color: #f06060; }
.footer-inner { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; }

/* TOPBAR */
.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 300; background: rgba(14,14,15,0.94); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,0.08); }
.topbar-inner { max-width: 1100px; margin: 0 auto; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; }
.topbar-home { font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #fff; text-decoration: none; padding: 7px 16px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.08); transition: border-color .2s, color .2s; }
.topbar-home:hover { border-color: var(--accent); color: var(--accent); }
.topbar-links { display: flex; gap: 10px; }
.topbar-tg { font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 600; padding: 8px 18px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.08); background: var(--surface); color: var(--text); text-decoration: none; transition: background .2s, border-color .2s; }
.topbar-tg:hover { background: var(--surface2); border-color: rgba(255,255,255,.18); }
.topbar-yt { font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 700; padding: 8px 18px; border-radius: 100px; background: var(--accent); color: #000; border: 1px solid var(--accent); text-decoration: none; transition: background .2s; }
.topbar-yt:hover { background: #d8ff70; }

/* HEADER */
header { padding: 32px 0 28px; position: relative; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.7)} }
h1 { font-family: 'Unbounded', sans-serif; font-size: clamp(28px,5vw,56px); font-weight: 700; line-height: 1.05; letter-spacing: -.02em; margin-bottom: 20px; }
h1 span.gr { color: var(--accent); display: block; }

.topbar-tg-icon { display: none; width: 34px; height: 34px; border-radius: 50%; background: var(--surface2); border: 1px solid rgba(255,255,255,0.08); color: var(--text); text-decoration: none; align-items: center; justify-content: center; font-size: 15px; transition: border-color .2s; }
.topbar-tg-icon:hover { border-color: var(--accent2); }
.level-switcher { display: flex; gap: 10px; margin-top: 24px; }
.level-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 12px 28px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; transition: border-color .2s, background .2s; min-width: 100px; }
.level-btn:hover { border-color: var(--accent); background: rgba(200,240,96,0.05); }
.level-btn.active { border-color: var(--accent); background: rgba(200,240,96,0.08); }
.level-label { font-family: 'Unbounded', sans-serif; font-size: 18px; font-weight: 700; color: var(--muted); transition: color .2s; }
.level-btn:hover .level-label { color: var(--accent); }
.level-btn.active .level-label { color: var(--accent); }
.level-count { font-size: 11px; color: var(--muted); font-family: 'Manrope', sans-serif; letter-spacing: .02em; }

/* MOBILE HOME BUTTON */
.mobile-home { display: none; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; font-family: 'Manrope', sans-serif; color: var(--muted); text-decoration: none; padding: 6px 0; margin-bottom: 16px; transition: color .15s; }
.mobile-home:hover { color: var(--text); }
.mobile-home::before { content: '←'; font-size: 14px; }

/* FILTER BAR */
.filter-bar { position: sticky; top: 0; z-index: 100; background: rgba(14,14,15,0.94); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); padding-top: env(safe-area-inset-top, 0px); margin-bottom: 28px; }
.filter-inner { max-width: 1100px; margin: 0 auto; padding: 10px 24px; display: flex; gap: 8px; flex-wrap: wrap; }
.filter-btn { font-size: 12px; font-weight: 600; font-family: 'Manrope', sans-serif; color: var(--muted); padding: 6px 14px; cursor: pointer; border: 1px solid var(--border); border-radius: 40px; background: none; transition: color .15s, border-color .15s, background .15s; white-space: nowrap; }
.filter-btn:hover { color: var(--text); border-color: var(--border2); }
.filter-btn.active { color: #000; background: var(--accent); border-color: var(--accent); }

/* empty state */
.empty-state { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--muted); font-size: 15px; }

/* 2-COLUMN GRID */
.tasks-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; padding-bottom: 80px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color .2s, transform .2s; cursor: pointer; scroll-margin-top: 58px; }
.card:hover { border-color: var(--border2); transform: translateY(-2px); }
.card.open { border-color: var(--card-accent); transform: none; }
.card.hidden { display: none; }
.card-top { padding: 20px 22px 18px; display: flex; align-items: flex-start; gap: 12px; }
.card-num { font-family: 'Unbounded', sans-serif; font-size: 10px; font-weight: 700; color: var(--card-accent); opacity: 0.6; flex-shrink: 0; padding-top: 2px; }
.card-number { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 24px; gap: 2px; flex-shrink: 0; padding-top: 2px; }
.card-number .num { font-family: 'Unbounded', sans-serif; font-size: 10px; font-weight: 700; color: var(--card-accent); opacity: 0.6; line-height: 1.2; }
.card-number .year { font-size: 9px; color: rgba(255,255,255,0.25); line-height: 1.2; letter-spacing: 0.02em; }
.card-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; background: var(--card-icon-bg); }
.card-title-block { flex: 1; }
.card-title { font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: -.01em; color: var(--text); margin-bottom: 4px; }
.card-hint { font-size: 12px; color: var(--muted); }
.card-toggle { width: 28px; height: 28px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px; color: var(--muted); transition: transform .25s, background .2s; }
.card.open .card-toggle { transform: rotate(45deg); background: var(--card-accent); color: #000; border-color: transparent; }
.card-body { display: none; padding: 0 22px 20px; animation: slideDown .2s ease; }
@keyframes slideDown { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
.card.open .card-body { display: block; }
.divider { height: 1px; background: var(--border); margin-bottom: 18px; }
.section-label { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.roles-split { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap: 10px; margin-bottom: 18px; }
.role-block-a { grid-column: 1; grid-row: 1; }
.role-block-b { grid-column: 2; grid-row: 1; }
.hints-a { grid-column: 1; grid-row: 2; }
.hints-b { grid-column: 2; grid-row: 2; }
.hints-block { display: flex; flex-direction: column; gap: 0; }
.role-block { background: var(--surface2); border-radius: 10px; padding: 14px 16px; border: 1px solid var(--border); }
.role-block-label { font-family: 'Unbounded', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--card-accent); margin-bottom: 8px; }
.role-block-text { font-size: 13px; line-height: 1.7; color: var(--text); }
.expand-btn { display: flex; align-items: center; gap: 6px; margin-top: 12px; background: none; border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; font-size: 12px; color: var(--muted); cursor: pointer; font-family: 'Manrope', sans-serif; transition: border-color .15s, color .15s; width: 100%; text-align: left; }
.expand-btn:hover { border-color: var(--card-accent); color: var(--text); }
.expand-btn .arrow { transition: transform .2s; margin-left: auto; display: inline-block; }
.expand-btn.open .arrow { transform: rotate(180deg); }
.expand-content { display: none; margin-top: 8px; padding: 10px 12px 10px 14px; background: rgba(0,0,0,0.25); border-radius: 0 0 8px 8px; border-left: 2px solid var(--card-accent); }
.expand-content.open { display: block; }
.expand-content li { font-size: 13px; color: var(--text); line-height: 1.65; margin-bottom: 8px; list-style: none; padding-left: 18px; position: relative; }
.expand-content li::before { content: '→'; position: absolute; left: 0; color: var(--card-accent); font-size: 11px; top: 2px; }
.expand-content li:last-child { margin-bottom: 0; }
.criteria-content { border-left-color: rgba(240,224,96,0.6); }
.criteria-content li::before { color: #f0e060; }
.criteria-btn { border-color: rgba(240,224,96,0.25); }
.criteria-btn:hover { border-color: #f0e060; }
.vocab-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.vocab-tag { font-size: 12px; padding: 4px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); letter-spacing: .01em; }

/* TRANSLATION POPUP */
#translate-popup { display: none; position: fixed; z-index: 9999; background: #17171a; border: 1px solid rgba(200,240,96,.5); border-radius: 10px; padding: 10px 14px; max-width: 280px; min-width: 120px; box-shadow: 0 6px 28px rgba(0,0,0,.6); pointer-events: none; }
#translate-popup .tpop-label { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 5px; }
#translate-popup .tpop-text { font-size: 14px; line-height: 1.55; color: var(--text); }
.tpop-loader { font-size: 12px; color: var(--muted); font-style: italic; }

/* RANDOM BUTTON */
#random-btn { display: flex; position: fixed; bottom: 24px; right: 72px; z-index: 200; width: 42px; height: 42px; border-radius: 50%; background: var(--surface2); color: var(--text); border: 1px solid var(--border2); font-size: 20px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.4); align-items: center; justify-content: center; transition: background .2s, border-color .2s; }
#random-btn:hover { background: var(--surface); border-color: var(--accent); }
/* RANDOM MODAL */
.rmodal-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 20px; }
.rmodal-card { background: var(--surface); border: 1px solid var(--border2); border-radius: 18px; width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); animation: rmodalIn .2s ease; }
@keyframes rmodalIn { from{opacity:0;transform:scale(.96)} to{opacity:1;transform:scale(1)} }
.rmodal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.rmodal-title-block { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.rmodal-num { font-family: 'Unbounded', sans-serif; font-size: 10px; font-weight: 700; color: var(--accent); opacity: 0.6; flex-shrink: 0; }
.rmodal-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; background: var(--surface2); }
.rmodal-title { font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.rmodal-hint { font-size: 12px; color: var(--muted); }
.rmodal-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.rmodal-refresh { width: 32px; height: 32px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color .15s, color .15s; }
.rmodal-refresh:hover { border-color: var(--accent); color: var(--accent); }
.rmodal-close { width: 32px; height: 32px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color .15s, color .15s; }
.rmodal-close:hover { border-color: var(--accent3); color: var(--accent3); }
.rmodal-divider { height: 1px; background: var(--border); margin-bottom: 16px; }
.rmodal-roles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .rmodal-roles { grid-template-columns: 1fr; } .rmodal-card { padding: 18px; } }

/* BACK TO TOP */
#back-to-top { display: none; position: fixed; bottom: 24px; right: 20px; z-index: 200; width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #000; border: none; font-size: 18px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.4); align-items: center; justify-content: center; transition: opacity .2s; }
#back-to-top.visible { display: flex; }

@media (max-width: 680px) {
  .tasks-grid { grid-template-columns: 1fr; }
  header { padding: 20px 0 24px; }
  h1 { font-size: 32px; }
  .level-switcher { margin-top: 16px; }
  .level-btn { padding: 10px 20px; min-width: 80px; }
  .level-label { font-size: 15px; }
  .filter-btn { font-size: 11px; padding: 5px 11px; }
  .topbar-tg, .topbar-yt { display: none; }
  .topbar-tg-icon { display: flex; }
  .topbar-inner { padding: 12px 16px; }
  #random-btn { right: 20px; bottom: 76px; }
  .card-top { padding: 14px 16px 12px; }
  .card-body { padding: 0 16px 16px; }
  .roles-split { grid-template-columns: 1fr; grid-template-rows: auto; }
  .role-block-a { grid-column: 1; grid-row: 1; }
  .role-block-b { grid-column: 1; grid-row: 2; }
  .hints-a { grid-column: 1; grid-row: 3; }
  .hints-b { grid-column: 1; grid-row: 4; }
  .filter-inner { display: flex; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; gap: 8px; padding-bottom: 4px; }
  .filter-inner::-webkit-scrollbar { display: none; }
  .filter-inner button { flex-shrink: 0; white-space: nowrap; min-height: 36px; }
}
</style>
</head>
<body>

<div id="translate-popup">
  <div class="tpop-label">Перевод</div>
  <div class="tpop-text" id="tpop-content"><span class="tpop-loader">переводим...</span></div>
</div>

<div class="topbar">
  <div class="topbar-inner">
    <a class="topbar-home" href="../Main/mathainw_hero.html">← На главную</a>
    <div class="topbar-links">
      <a class="topbar-tg" href="https://t.me/mathenoel" target="_blank">+ Telegram</a>
      <a class="topbar-yt" href="https://www.youtube.com/channel/UCl9rhSzwORE5APQO2LaGk1A" target="_blank">▶ YouTube</a>
      <a class="topbar-tg-icon" href="https://t.me/mathenoel" target="_blank" title="Telegram">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221-1.97 9.289c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L8.32 14.173l-2.96-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.828.386z" fill="#c8f060"/>
        </svg>
      </a>
    </div>
  </div>
</div>

<div class="container">
  <header>
    <h1>Ролевые<br><span class="gr">Диалоги</span></h1>
    <div class="level-switcher">
      <button class="level-btn" data-level="a2">
        <span class="level-label">А2</span>
        <span class="level-count" id="count-a2"></span>
      </button>
      <button class="level-btn active" data-level="b1">
        <span class="level-label">Б1</span>
        <span class="level-count" id="count-b1"></span>
      </button>
    </div>
  </header>
</div>

<div class="filter-bar">
  <div class="filter-inner" id="filter-inner"></div>
</div>

<div class="container">
  <div class="tasks-grid" id="grid"></div>
</div>

<footer>
  <div class="container">
    <div class="footer-inner">
      <a class="social-link tg" href="https://t.me/mathenoel" target="_blank">✈ Telegram</a>
      <a class="social-link yt" href="https://www.youtube.com/channel/UCl9rhSzwORE5APQO2LaGk1A" target="_blank">▶ YouTube</a>

    <p style="margin-top:16px; font-size:11px; color:var(--muted); text-align:center; line-height:1.6; max-width:600px; margin-left:auto; margin-right:auto;">Задания составлены в учебных целях и адаптированы по мотивам открытых экзаменационных материалов. Не являются точным воспроизведением оригинальных источников.</p>

<!-- RANDOM DIALOG MODAL -->
<div id="random-modal" class="rmodal-overlay" style="display:none;">
  <div class="rmodal-card">

      <div class="rmodal-title-block">
        <span class="rmodal-num" id="rmodal-num"></span>
        <span class="rmodal-icon" id="rmodal-icon"></span>

        <button class="rmodal-refresh" id="rmodal-refresh" title="Другой диалог">↻</button>

      </div>
    </div>
    <div class="rmodal-divider"></div>
    <div class="rmodal-roles" id="rmodal-roles"></div>
  </div>
</div>

<script src="app.js"></script>
