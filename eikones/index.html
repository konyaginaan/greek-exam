<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Εξέταση Α2 & Β1 — Περιγραφή Εικόνων</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0e0e0f;
    --card:     #161618;
    --card2:    #1e1e21;
    --border:   rgba(255,255,255,0.08);
    --lime:     #c8f060;
    --blue:     #60d4f0;
    --pink:     #f060b0;
    --text:     #e8e8ec;
    --muted:    #6b6b78;
    --a2-accent: var(--lime);
    --b1-accent: var(--blue);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Manrope", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ДЕКОРАТИВНАЯ СЕТКА */
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(200,240,96,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,240,96,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  /* HEADER */
  .header {
    position: relative; z-index: 10;
    background: rgba(14,14,15,0.85);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem;
  }
  .header-left { display: flex; align-items: center; gap: 1rem; }
  .badge {
    background: var(--lime); color: #0e0e0f;
    font-family: "Unbounded", sans-serif;
    font-size: 0.7rem; font-weight: 700;
    padding: 6px 10px; border-radius: 8px;
    white-space: nowrap; letter-spacing: -0.02em;
  }
  .header-title h1 {
    font-family: "Unbounded", sans-serif;
    font-size: 0.85rem; font-weight: 700;
    color: var(--text); letter-spacing: -0.03em;
  }
  .header-title p { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }
  .header-right { display: flex; align-items: center; gap: 1rem; }
  .header-meta { font-size: 0.7rem; color: var(--muted); text-align: right; line-height: 1.6; }
  .social-links { display: flex; gap: 6px; }
  .social-btn {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid var(--border);
    transition: all 0.2s; text-decoration: none;
  }
  .social-btn:hover { border-color: var(--lime); background: rgba(200,240,96,0.08); }
  .social-btn svg { width: 16px; height: 16px; }

  /* NAV */
  .nav-bar {
    position: sticky; top: 0; z-index: 99;
    background: rgba(14,14,15,0.8);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 0.6rem 2rem;
    display: flex; align-items: center; gap: 0.5rem;
    overflow-x: auto; scrollbar-width: none;
  }
  .nav-bar::-webkit-scrollbar { display: none; }
  .nav-pill {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted); border-radius: 20px;
    padding: 5px 14px; font-size: 0.72rem; font-weight: 600;
    font-family: "Manrope", sans-serif;
    cursor: pointer; transition: all 0.2s;
    white-space: nowrap; text-decoration: none; display: inline-block;
    letter-spacing: 0.02em;
  }
  .nav-pill:hover { border-color: rgba(200,240,96,0.4); color: var(--lime); }
  .nav-pill.active {
    background: var(--lime); color: #0e0e0f;
    border-color: var(--lime); font-weight: 700;
  }

  /* CONTAINER */
  .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 2.5rem 1.5rem 6rem; }

  /* SECTION */
  .image-section { margin-bottom: 5rem; scroll-margin-top: 60px; }
  .section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 1.25rem; }
  .section-badge {
    background: var(--lime); color: #0e0e0f;
    font-family: "Unbounded", sans-serif;
    font-size: 0.75rem; font-weight: 700;
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .section-title {
    font-family: "Unbounded", sans-serif;
    font-size: 1rem; font-weight: 700;
    color: var(--text); letter-spacing: -0.03em;
  }
  .section-label {
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 0.6rem;
  }

  /* IMAGE CARD */
  .image-card {
    background: var(--card); border-radius: 14px; overflow: hidden;
    border: 1px solid var(--border); margin-bottom: 1rem;
    transition: border-color 0.3s;
  }
  .image-card:hover { border-color: rgba(200,240,96,0.25); }
  .image-wrap img { width: 100%; height: auto; display: block; }
  .image-caption {
    padding: 0.75rem 1.25rem;
    border-top: 1px solid var(--border);
    font-size: 0.76rem; color: var(--muted); font-style: italic;
  }

  /* BLOCK CARD (questions) */
  .block-card {
    background: var(--card); border-radius: 14px;
    border: 1px solid var(--border);
    margin-bottom: 1rem; overflow: hidden;
    transition: border-color 0.3s;
  }
  .block-card.open { border-color: rgba(200,240,96,0.35); }
  .block-card-header {
    padding: 1rem 1.25rem;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
  }
  .block-card-header:hover { background: rgba(255,255,255,0.02); }
  .block-card-title {
    font-family: "Unbounded", sans-serif;
    font-size: 0.75rem; font-weight: 700;
    color: var(--text); letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 10px;
  }
  .block-card-title::before {
    content: ""; display: block;
    width: 3px; height: 14px;
    background: var(--lime); border-radius: 2px; flex-shrink: 0;
  }
  .block-chevron { width: 15px; height: 15px; color: var(--muted); transition: transform 0.3s; flex-shrink: 0; }
  .block-card.open .block-chevron { transform: rotate(180deg); }
  .question-list { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; list-style: none; }
  .block-card.open .question-list { max-height: 800px; }
  .question-list li {
    padding: 0.7rem 1.25rem; border-top: 1px solid var(--border);
    font-size: 0.875rem; display: flex; gap: 10px; align-items: flex-start;
    line-height: 1.6;
  }
  .q-num {
    min-width: 20px; height: 20px;
    border: 1px solid rgba(200,240,96,0.4); color: var(--lime);
    border-radius: 50%; font-size: 0.65rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    margin-top: 2px; flex-shrink: 0;
  }
  .q-speak {
    margin-left: auto; background: none; border: none; cursor: pointer;
    color: var(--muted); padding: 2px 4px; border-radius: 4px;
    transition: color 0.2s; flex-shrink: 0;
  }
  .q-speak:hover { color: var(--lime); }
  .q-speak svg { width: 13px; height: 13px; display: block; }

  /* DESC CARDS */
  .desc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
  @media (max-width: 640px) { .desc-grid { grid-template-columns: 1fr; } }

  .desc-card {
    background: var(--card); border-radius: 14px; overflow: hidden;
    border: 1px solid var(--border); transition: border-color 0.3s;
  }
  .desc-card.open { --open-accent: var(--a2-accent); border-color: rgba(200,240,96,0.35); }
  .desc-card.b1-card.open { --open-accent: var(--b1-accent); border-color: rgba(96,212,240,0.35); }

  .desc-header {
    padding: 0.9rem 1.25rem;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none; transition: background 0.2s;
  }
  .desc-header:hover { background: rgba(255,255,255,0.02); }
  .desc-header-left { display: flex; align-items: center; gap: 10px; }
  .level-pill {
    font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 3px 10px; border-radius: 20px; border: 1px solid;
  }
  .a2-pill { border-color: rgba(200,240,96,0.5); color: var(--lime); }
  .b1-pill { border-color: rgba(96,212,240,0.5); color: var(--blue); }
  .desc-title { font-size: 0.82rem; font-weight: 600; color: var(--text); }
  .chevron { width: 15px; height: 15px; color: var(--muted); transition: transform 0.3s; flex-shrink: 0; }
  .desc-card.open .chevron { transform: rotate(180deg); }
  .desc-body { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
  .desc-card.open .desc-body { max-height: 900px; }
  .desc-inner { padding: 0 1.25rem 1.25rem; border-top: 1px solid var(--border); }
  .desc-inner p {
    font-size: 0.875rem; line-height: 1.85; color: var(--text);
    margin-top: 0.85rem; cursor: text;
  }
  .desc-inner p.a2-text { border-left: 3px solid var(--lime); padding-left: 0.85rem; }
  .desc-inner p.b1-text { border-left: 3px solid var(--blue); padding-left: 0.85rem; }
  .desc-speak-row { margin-top: 0.75rem; }

  /* BUTTONS */
  .speak-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; border: 1px solid rgba(200,240,96,0.4); color: var(--lime);
    border-radius: 20px; padding: 5px 14px; font-size: 0.73rem;
    font-family: "Manrope", sans-serif; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .speak-btn:hover { background: rgba(200,240,96,0.1); }
  .speak-btn.speaking { background: var(--lime); color: #0e0e0f; }
  .speak-btn svg { width: 12px; height: 12px; }

  .b1-card .speak-btn {
    border-color: rgba(96,212,240,0.4); color: var(--blue);
  }
  .b1-card .speak-btn:hover { background: rgba(96,212,240,0.1); }
  .b1-card .speak-btn.speaking { background: var(--blue); color: #0e0e0f; }

  .audio-row { display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
  .audio-row audio { height: 30px; flex: 1; min-width: 160px; max-width: 280px; filter: invert(1) hue-rotate(180deg) brightness(0.8); }

  /* VOCAB */
  .vocab-card {
    background: var(--card); border-radius: 14px; overflow: hidden;
    border: 1px solid var(--border); margin-bottom: 1rem;
    transition: border-color 0.3s;
  }
  .vocab-card.open { border-color: rgba(240,96,176,0.35); }
  .vocab-header {
    padding: 1rem 1.25rem;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none; transition: background 0.2s;
  }
  .vocab-header:hover { background: rgba(255,255,255,0.02); }
  .vocab-header h2 {
    font-family: "Unbounded", sans-serif;
    font-size: 0.75rem; font-weight: 700; color: var(--text);
    display: flex; align-items: center; gap: 10px; letter-spacing: -0.02em;
  }
  .vocab-header h2::before {
    content: ""; display: block; width: 3px; height: 14px;
    background: var(--pink); border-radius: 2px;
  }
  .vocab-card.open .chevron { transform: rotate(180deg); }
  .vocab-body { max-height: 0; overflow: hidden; transition: max-height 0.5s ease; }
  .vocab-card.open .vocab-body { max-height: 1400px; }
  .vocab-tabs { display: flex; border-top: 1px solid var(--border); }
  .vocab-tab {
    flex: 1; padding: 0.65rem; text-align: center;
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; cursor: pointer;
    border-bottom: 2px solid transparent; transition: all 0.2s;
    color: var(--muted); font-family: "Manrope", sans-serif;
  }
  .vocab-tab.active.a2 { color: var(--lime); border-color: var(--lime); background: rgba(200,240,96,0.05); }
  .vocab-tab.active.b1 { color: var(--blue); border-color: var(--blue); background: rgba(96,212,240,0.05); }
  .vocab-panel { display: none; padding: 0.5rem 1.25rem 1rem; }
  .vocab-panel.active { display: block; }
  .vocab-table { width: 100%; border-collapse: collapse; }
  .vocab-table tr { border-bottom: 1px solid var(--border); }
  .vocab-table tr:last-child { border-bottom: none; }
  .vocab-table td { padding: 0.55rem 0.3rem; font-size: 0.84rem; }
  .vocab-table td:first-child { font-weight: 600; color: var(--text); width: 55%; }
  .vocab-table td:last-child { color: var(--muted); }
  .speak-word {
    background: none; border: none; cursor: pointer;
    color: var(--muted); padding: 0 4px; transition: color 0.2s;
    font-size: 0.75rem; vertical-align: middle;
  }
  .speak-word:hover { color: var(--lime); }

  /* SUNO CARD */
  .suno-card {
    background: var(--card2); border-radius: 14px; padding: 1rem 1.25rem;
    margin-bottom: 1rem; border: 1px solid var(--border);
  }
  .suno-card-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.65rem; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.75rem;
  }
  .suno-card-label svg { width: 13px; height: 13px; }
  .suno-card-btns { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  .suno-card-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 16px; border-radius: 20px; font-size: 0.78rem;
    font-family: "Manrope", sans-serif; font-weight: 600;
    text-decoration: none; transition: all 0.2s; border: 1px solid;
  }
  .suno-card-btn.a2 { border-color: rgba(200,240,96,0.4); color: var(--lime); }
  .suno-card-btn.a2:hover { background: rgba(200,240,96,0.1); }
  .suno-card-btn.b1 { border-color: rgba(96,212,240,0.4); color: var(--blue); }
  .suno-card-btn.b1:hover { background: rgba(96,212,240,0.1); }

  /* TELEGRAM BTN */
  .tg-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: transparent; border: 1px solid rgba(240,96,176,0.35); color: var(--pink);
    border-radius: 12px; padding: 0.75rem 1.5rem;
    font-size: 0.82rem; font-weight: 600; font-family: "Manrope", sans-serif;
    text-decoration: none; transition: all 0.2s; margin-bottom: 0.5rem; width: 100%;
  }
  .tg-btn:hover { background: rgba(240,96,176,0.08); border-color: var(--pink); }
  .tg-btn svg { width: 15px; height: 15px; }

  /* PLAYLIST BANNER */
  .playlist-banner {
    background: var(--card); border-radius: 14px; padding: 1.25rem 1.5rem;
    margin-bottom: 2.5rem;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 1rem;
    border: 1px solid rgba(200,240,96,0.2);
  }
  .playlist-banner-left { display: flex; align-items: center; gap: 12px; }
  .playlist-banner-left svg { width: 20px; height: 20px; color: var(--lime); flex-shrink: 0; }
  .playlist-banner-text h3 {
    font-family: "Unbounded", sans-serif;
    font-size: 0.8rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em;
  }
  .playlist-banner-text p { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }
  .playlist-link {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--lime); color: #0e0e0f;
    border-radius: 20px; padding: 7px 18px;
    font-size: 0.76rem; font-weight: 700; font-family: "Manrope", sans-serif;
    text-decoration: none; transition: all 0.2s; white-space: nowrap;
  }
  .playlist-link:hover { background: #deff80; }

  /* DIVIDER */
  .section-divider {
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.07), transparent);
    margin: 3.5rem 0;
  }

  /* TRANSLATE POPUP */
  #translatePopup {
    position: absolute; z-index: 9999;
    background: var(--card2);
    border: 1px solid rgba(200,240,96,0.3);
    border-radius: 10px; padding: 9px 13px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    max-width: 260px; min-width: 130px;
    font-size: 0.82rem; line-height: 1.5;
    display: none; pointer-events: none;
  }
  #translatePopup .original { font-size: 0.68rem; color: var(--lime); margin-bottom: 3px; font-style: italic; }
  #translatePopup .translation { font-weight: 600; color: var(--text); }
  #translatePopup .loading { color: var(--muted); font-style: italic; }

  /* SCROLL TO TOP */
  #scrollTop {
    position: fixed; bottom: 2rem; right: 2rem; z-index: 200;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--lime); color: #0e0e0f;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(200,240,96,0.3);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    transform: translateY(10px);
  }
  #scrollTop.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
  #scrollTop:hover { background: #deff80; }
  #scrollTop svg { width: 18px; height: 18px; }

  /* LOADING */
  #loadingMsg { text-align: center; padding: 4rem; color: var(--muted); font-size: 0.9rem; font-family: "Manrope", sans-serif; }

  /* MOBILE */
  @media (max-width: 600px) {
    .header { padding: 0.9rem 1rem; }
    .header-meta { display: none; }
    .nav-bar { padding: 0.5rem 1rem; }
    .container { padding: 1.5rem 1rem 5rem; }
    .section-title { font-size: 0.85rem; }
    #scrollTop { bottom: 1.25rem; right: 1.25rem; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="badge">A2–B1</div>
    <div class="header-title">
      <h1>Περιγραφή Εικόνων</h1>
      <p>Παραγωγή προφορικού λόγου — Επίπεδα A2 &amp; B1</p>
    </div>
  </div>
  <div class="header-right">
    <div class="social-links">
      <a class="social-btn" href="https://t.me/mathenoel" target="_blank" title="Telegram">
        <svg viewBox="0 0 24 24" fill="none"><path d="M21.5 2.5L2 10l7 2.5L17 7l-6 7 7 3 3.5-14.5z" stroke="#c8f060" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </a>
      <a class="social-btn" href="https://www.youtube.com/channel/UCl9rhSzwORE5APQO2LaGk1A" target="_blank" title="YouTube">
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="3" stroke="#c8f060" stroke-width="1.5"/><polygon points="10,9 16,12 10,15" fill="#c8f060"/></svg>
      </a>
    </div>
    <div class="header-meta">Εξεταστικά Θέματα<br>2015–2018</div>
  </div>
</div>

<nav class="nav-bar" id="navBar"></nav>

<div class="container">
  <div class="playlist-banner" id="playlistBanner" style="display:none">
    <div class="playlist-banner-left">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <div class="playlist-banner-text">
        <h3>Все описания — одним плейлистом на Suno</h3>
        <p>Слушайте греческий в любое время</p>
      </div>
    </div>
    <a href="#" class="playlist-link" id="playlistLink" target="_blank">Открыть плейлист →</a>
  </div>
  <div id="loadingMsg">Загрузка...</div>
  <div id="mainContainer"></div>
</div>

<button id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
</button>

<div id="translatePopup">
  <div class="original"></div>
  <div class="translation"></div>
</div>

<script>
  // scroll to top button
  window.addEventListener('scroll', () => {
    document.getElementById('scrollTop').classList.toggle('visible', window.scrollY > 400);
  });
</script>
<script src="app.js"></script>
</body>
</html>
