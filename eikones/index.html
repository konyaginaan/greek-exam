<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Εξέταση Α2 & Β1 — Περιγραφή Εικόνων</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #5fb3b3;
    --c2: #1d7a6b;
    --c3: #2e4f7a;
    --c4: #233a6b;
    --c5: #1a2755;
    --c1-light: #e8f5f5;
    --c2-light: #e0f2ee;
    --c3-light: #e6ecf5;
    --sand: #f4f6f9;
    --white: #ffffff;
    --text: #0f1e3a;
    --text-muted: #5a6a82;
    --a2-color: #1d7a6b;
    --a2-bg: #e0f2ee;
    --b1-color: #2e4f7a;
    --b1-bg: #e6ecf5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Source Sans 3", sans-serif; background: var(--sand); color: var(--text); min-height: 100vh; }

  /* HEADER */
  .header {
    background: var(--c5); color: white;
    padding: 1.25rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 3px solid var(--c1);
  }
  .header-left { display: flex; align-items: center; gap: 1rem; }
  .badge {
    background: var(--c1); color: var(--c5);
    font-family: "Playfair Display", serif;
    font-size: 0.85rem; font-weight: 600;
    width: 56px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
  }
  .header-title h1 { font-family: "Playfair Display", serif; font-size: 1.1rem; font-weight: 400; }
  .header-title p { font-size: 0.78rem; color: var(--c1); margin-top: 2px; }
  .header-meta { font-size: 0.75rem; color: #8899bb; text-align: right; line-height: 1.6; }
  .social-links { display: flex; gap: 8px; align-items: center; }
  .social-btn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 8px;
    transition: all 0.2s; text-decoration: none;
    border: 1.5px solid rgba(95,179,179,0.3);
  }
  .social-btn:hover { background: rgba(95,179,179,0.15); border-color: var(--c1); }
  .social-btn svg { width: 18px; height: 18px; }

  /* NAV */
  .nav-bar {
    background: var(--c4);
    padding: 0.6rem 2rem;
    display: flex; align-items: center; gap: 0.5rem;
    overflow-x: auto; scrollbar-width: none;
    position: sticky; top: 0; z-index: 99;
    border-bottom: 1px solid var(--c5);
  }
  .nav-bar::-webkit-scrollbar { display: none; }
  .nav-pill {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(95,179,179,0.25);
    color: #aabbd4; border-radius: 20px;
    padding: 4px 14px; font-size: 0.75rem;
    font-weight: 500; cursor: pointer;
    transition: all 0.2s; white-space: nowrap;
    text-decoration: none; display: inline-block;
  }
  .nav-pill:hover { background: rgba(95,179,179,0.2); color: var(--c1); }
  .nav-pill.active { background: var(--c1); color: var(--c5); border-color: var(--c1); font-weight: 600; }

  /* CONTAINER */
  .container { max-width: 900px; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }

  /* IMAGE SECTION */
  .image-section { margin-bottom: 4rem; scroll-margin-top: 55px; }
  .section-num { display: flex; align-items: center; gap: 12px; margin-bottom: 1rem; }
  .section-num-badge {
    background: var(--c2); color: white;
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem; font-weight: 600; flex-shrink: 0;
  }
  .section-num-title { font-family: "Playfair Display", serif; font-size: 1.2rem; color: var(--c5); }
  .section-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c2); margin-bottom: 0.6rem; }

  /* IMAGE CARD */
  .image-card {
    background: white; border-radius: 16px; overflow: hidden;
    box-shadow: 0 4px 24px rgba(26,39,85,0.1);
    margin-bottom: 1.25rem; border: 1px solid #dde4ef;
  }
  .image-wrap img { width: 100%; height: auto; object-fit: contain; display: block; }
  .image-caption {
    padding: 0.9rem 1.5rem;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid #eef1f7; background: #fafbfd;
  }
  .image-caption p { font-size: 0.82rem; color: var(--text-muted); font-style: italic; }

  /* BUTTONS */
  .speak-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: 1.5px solid var(--c2); color: var(--c2);
    border-radius: 20px; padding: 5px 14px; font-size: 0.76rem;
    font-family: "Source Sans 3", sans-serif; cursor: pointer;
    transition: all 0.2s; font-weight: 500; margin-top: 0.75rem;
  }
  .speak-btn:hover { background: var(--c2); color: white; }
  .speak-btn.speaking { background: var(--c2); color: white; }
  .speak-btn svg { width: 13px; height: 13px; }

  .suno-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: 1.5px solid var(--c3); color: var(--c3);
    border-radius: 20px; padding: 5px 14px; font-size: 0.76rem;
    font-family: "Source Sans 3", sans-serif;
    transition: all 0.2s; font-weight: 500;
    text-decoration: none; margin-top: 0.75rem; margin-left: 0.5rem;
  }
  .suno-btn:hover { background: var(--c3); color: white; }
  .suno-btn svg { width: 13px; height: 13px; }
  .suno-btn.b1 { border-color: var(--b1-color); color: var(--b1-color); }
  .suno-btn.b1:hover { background: var(--b1-color); color: white; }

  .audio-row { display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
  .audio-row audio { height: 32px; flex: 1; min-width: 180px; max-width: 300px; }

  /* BLOCK CARD (questions) */
  .block-card {
    background: white; border-radius: 16px; padding: 1.25rem 1.5rem;
    margin-bottom: 1.25rem;
    box-shadow: 0 2px 12px rgba(26,39,85,0.07); border: 1px solid #dde4ef;
  }
  .block-card h2 {
    font-family: "Playfair Display", serif; font-size: 1rem;
    font-weight: 600; color: var(--c5);
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none;
  }
  .block-chevron { width: 16px; height: 16px; color: var(--text-muted); transition: transform 0.3s; flex-shrink: 0; }
  .block-card.open .block-chevron { transform: rotate(180deg); }
  .question-list { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; list-style: none; }
  .block-card.open .question-list { max-height: 800px; }
  .question-list li {
    padding: 0.65rem 0; border-bottom: 1px solid #f0f3f8;
    font-size: 0.9rem; display: flex; gap: 10px; align-items: flex-start;
  }
  .question-list li:last-child { border-bottom: none; }
  .q-num {
    min-width: 20px; height: 20px; background: var(--c1-light); color: var(--c2);
    border-radius: 50%; font-size: 0.68rem; font-weight: 600;
    display: flex; align-items: center; justify-content: center; margin-top: 2px; flex-shrink: 0;
  }
  .q-speak {
    margin-left: auto; background: none; border: none; cursor: pointer;
    color: var(--text-muted); padding: 2px 4px; border-radius: 4px; transition: color 0.2s; flex-shrink: 0;
  }
  .q-speak:hover { color: var(--c2); }
  .q-speak svg { width: 13px; height: 13px; display: block; }

  /* DESC CARDS */
  .desc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem; }
  @media (max-width: 640px) { .desc-grid { grid-template-columns: 1fr; } }
  .desc-card {
    background: white; border-radius: 16px; overflow: hidden;
    box-shadow: 0 2px 12px rgba(26,39,85,0.07); border: 1px solid #dde4ef;
  }
  .desc-header {
    padding: 0.9rem 1.25rem; display: flex; align-items: center;
    justify-content: space-between; cursor: pointer; user-select: none; transition: background 0.2s;
  }
  .desc-header:hover { background: #f7f9fc; }
  .desc-header-left { display: flex; align-items: center; gap: 10px; }
  .level-pill { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 9px; border-radius: 20px; }
  .a2-pill { background: var(--a2-bg); color: var(--a2-color); }
  .b1-pill { background: var(--b1-bg); color: var(--b1-color); }
  .desc-title { font-size: 0.85rem; font-weight: 500; color: var(--text); }
  .chevron { width: 16px; height: 16px; color: var(--text-muted); transition: transform 0.3s; flex-shrink: 0; }
  .desc-card.open .chevron { transform: rotate(180deg); }
  .desc-body { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
  .desc-card.open .desc-body { max-height: 800px; }
  .desc-inner { padding: 0 1.25rem 1.25rem; border-top: 1px solid #f0f3f8; }
  .desc-inner p { font-size: 0.88rem; line-height: 1.8; color: var(--text); margin-top: 0.75rem; cursor: text; }
  .desc-inner p.a2-text { border-left: 3px solid var(--a2-color); padding-left: 0.75rem; }
  .desc-inner p.b1-text { border-left: 3px solid var(--b1-color); padding-left: 0.75rem; }

  /* VOCAB */
  .vocab-card {
    background: white; border-radius: 16px; overflow: hidden;
    box-shadow: 0 2px 12px rgba(26,39,85,0.07); border: 1px solid #dde4ef;
    margin-bottom: 1.25rem;
  }
  .vocab-header { padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
  .vocab-header:hover { background: #f7f9fc; }
  .vocab-header h2 {
    font-family: "Playfair Display", serif; font-size: 1rem; font-weight: 600; color: var(--c5);
    display: flex; align-items: center; gap: 8px;
  }
  .vocab-header h2::before { content: ""; display: block; width: 4px; height: 16px; background: var(--c1); border-radius: 2px; }
  .vocab-card.open .chevron { transform: rotate(180deg); }
  .vocab-body { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
  .vocab-card.open .vocab-body { max-height: 1200px; }
  .vocab-tabs { display: flex; border-top: 1px solid #eef1f7; }
  .vocab-tab {
    flex: 1; padding: 0.65rem; text-align: center; font-size: 0.75rem;
    font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; color: var(--text-muted);
  }
  .vocab-tab.active.a2 { color: var(--a2-color); border-color: var(--a2-color); background: var(--a2-bg); }
  .vocab-tab.active.b1 { color: var(--b1-color); border-color: var(--b1-color); background: var(--b1-bg); }
  .vocab-panel { display: none; padding: 0.75rem 1.5rem 1rem; }
  .vocab-panel.active { display: block; }
  .vocab-table { width: 100%; border-collapse: collapse; }
  .vocab-table tr { border-bottom: 1px solid #f0f3f8; }
  .vocab-table tr:last-child { border-bottom: none; }
  .vocab-table td { padding: 0.55rem 0.4rem; font-size: 0.85rem; }
  .vocab-table td:first-child { font-weight: 500; color: var(--text); width: 55%; }
  .vocab-table td:last-child { color: var(--text-muted); }
  .speak-word { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0 4px; transition: color 0.2s; font-size: 0.75rem; vertical-align: middle; }
  .speak-word:hover { color: var(--c2); }

  /* DIVIDER */
  .section-divider { height: 1px; background: linear-gradient(to right, transparent, #c8d4e8, transparent); margin: 3rem 0; }

  /* TRANSLATE POPUP */
  #translatePopup {
    position: absolute; z-index: 9999;
    background: var(--c5); color: white;
    border-radius: 12px; padding: 10px 14px;
    box-shadow: 0 8px 32px rgba(26,39,85,0.35);
    max-width: 280px; min-width: 140px;
    font-size: 0.85rem; line-height: 1.5;
    border: 1px solid var(--c4);
    display: none; pointer-events: none;
  }
  #translatePopup .original { font-size: 0.72rem; color: var(--c1); margin-bottom: 4px; font-style: italic; }
  #translatePopup .translation { font-weight: 500; }
  #translatePopup .loading { color: #8cb8d4; font-style: italic; }

  /* LOADING */
  #loadingMsg { text-align: center; padding: 4rem; color: var(--text-muted); font-size: 0.9rem; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="badge">A2–B1</div>
    <div class="header-title">
      <h1>Περιγραφή Εικόνων</h1>
      <p>Παραγωγή προφορικού λόγου — Επίπεδα A2 &amp; B1</p>
    </div>
  </div>
  <div style="display:flex; align-items:center; gap:1rem;">
    <div class="social-links">
      <a class="social-btn" href="https://t.me/mathenoel" target="_blank" title="Telegram">
        <svg viewBox="0 0 24 24" fill="none"><path d="M21.5 2.5L2 10l7 2.5L17 7l-6 7 7 3 3.5-14.5z" stroke="#5fb3b3" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </a>
      <a class="social-btn" href="https://www.youtube.com/channel/UCl9rhSzwORE5APQO2LaGk1A" target="_blank" title="YouTube">
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="3" stroke="#5fb3b3" stroke-width="1.5"/><polygon points="10,9 16,12 10,15" fill="#5fb3b3"/></svg>
      </a>
    </div>
    <div class="header-meta">Εξεταστικά Θέματα<br>2015–2018</div>
  </div>
</div>

<nav class="nav-bar" id="navBar"></nav>

<div class="container">
  <div id="loadingMsg">Загрузка...</div>
  <div id="mainContainer"></div>
</div>

<div id="translatePopup">
  <div class="original"></div>
  <div class="translation"></div>
</div>

<script src="app.js"></script>
</body>
</html>
