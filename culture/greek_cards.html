<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Greek Words</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --lime: #c5f135;
    --lime-dark: #a8d020;
    --dark: #0d0d0d;
    --dark2: #1a1a1a;
    --dark3: #2a2a2a;
    --bg: #f2f1ec;
    --surface: #ffffff;
    --text: #0d0d0d;
    --muted: #999;
    --border: #e5e3db;
    --red: #e03c2d;
    --green: #1e8a45;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 1.25rem 1rem 2rem;
    max-width: 500px;
    margin: 0 auto;
  }

  .screen { display: none; flex-direction: column; flex: 1; }
  .screen.active { display: flex; }

  /* ── LOGO ── */
  .logo {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dark);
    margin-bottom: 1.75rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .logo-dot { color: var(--lime-dark); font-size: 18px; line-height: 1; }

  /* ── DECK LIST ── */
  .screen-title {
    font-size: 26px;
    font-weight: 800;
    color: var(--dark);
    margin-bottom: 0.3rem;
    line-height: 1.1;
  }
  .screen-title span { color: var(--lime-dark); }

  .screen-sub {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 1.75rem;
  }

  .deck-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 1.1rem 1.25rem;
    margin-bottom: 0.75rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: border-color 0.15s, transform 0.1s;
  }
  .deck-card:active { transform: scale(0.98); border-color: var(--lime-dark); }

  .deck-name { font-size: 15px; font-weight: 700; color: var(--dark); }
  .deck-count { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .deck-arrow { font-size: 22px; color: var(--lime-dark); font-weight: 700; }

  /* ── TOP BAR ── */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }
  .back-btn {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .round-badge {
    font-size: 12px;
    font-weight: 800;
    padding: 5px 12px;
    border-radius: 20px;
    background: var(--dark);
    color: var(--lime);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .counter { font-size: 13px; color: var(--muted); font-weight: 600; }

  /* ── PROGRESS ── */
  .progress-wrap {
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 10px;
    margin-bottom: 1.5rem;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--lime-dark);
    border-radius: 10px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* ── CARD ── */
  .card-wrap {
    width: 100%;
    height: 130px;
    perspective: 1200px;
    margin-bottom: 1.25rem;
    cursor: pointer;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.42s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
  }
  .card-inner.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 16px;
  }

  .card-face.front {
    background: var(--surface);
    border: 1.5px solid var(--border);
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    padding: 0 1.5rem;
    gap: 1rem;
  }

  .front-text { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; }

  .word {
    font-size: 22px;
    font-weight: 800;
    color: var(--dark);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tap-hint {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    font-weight: 600;
  }

  .flip-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
    color: var(--lime);
  }

  .card-face.back {
    background: var(--dark2);
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 0 1.5rem;
    border: 1.5px solid var(--dark3);
  }

  .translation {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    text-align: center;
    line-height: 1.3;
  }
  .original-back {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    text-align: center;
  }

  /* ── BUTTONS ── */
  .btns {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }

  .btns-main { display: flex; gap: 8px; width: 100%; }

  .btn {
    flex: 1;
    padding: 14px 6px;
    border: none;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .btn:active { transform: scale(0.96); }
  .btn-emoji { font-size: 20px; }

  .btn-again {
    background: var(--dark2);
    color: #fff;
    border: 1.5px solid var(--dark3);
  }
  .btn-ok {
    background: var(--dark);
    color: var(--lime);
    border: 1.5px solid var(--dark3);
  }

  .btn-star-wrap {
    width: 100%;
    text-align: center;
  }
  .btn-star {
    background: #f5f5f0;
    border: 1.5px solid var(--border);
    cursor: pointer;
    padding: 10px 16px;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    justify-content: center;
  }
  .btn-star:active { opacity: 0.6; }
  .btn-star-label { font-size: 13px; font-weight: 700; color: var(--lime-dark); }
  .btn-star-sub { font-size: 11px; color: var(--muted); }

  /* ── ROUND END ── */
  .round-end {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 2rem 0;
    gap: 0.6rem;
    flex: 1;
    justify-content: center;
  }
  .round-end-emoji { font-size: 52px; margin-bottom: 0.5rem; }
  .round-end-title { font-size: 24px; font-weight: 800; color: var(--dark); }
  .round-end-sub { font-size: 14px; color: var(--muted); line-height: 1.6; }

  .btn-primary {
    margin-top: 1.5rem;
    padding: 15px 32px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 800;
    background: var(--dark);
    color: var(--lime);
    cursor: pointer;
    width: 100%;
    letter-spacing: 0.02em;
  }
  .btn-primary:active { opacity: 0.85; }

  .btn-secondary {
    margin-top: 0.5rem;
    padding: 14px 32px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    width: 100%;
  }

  /* ── MASTERED LIST ── */
  .done-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.4rem;
  }
  .done-title { font-size: 22px; font-weight: 800; color: var(--dark); }
  .done-sub { font-size: 13px; color: var(--muted); margin-bottom: 1rem; }

  .mastered-list { display: flex; flex-direction: column; gap: 8px; }
  .mastered-item {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 0.75rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .mastered-word { font-size: 15px; font-weight: 700; color: var(--dark); }
  .mastered-trans { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .mastered-star { font-size: 16px; color: var(--lime-dark); }
</style>
</head>
<body>

<!-- ЭКРАН 1: ВЫБОР КОЛОДЫ -->
<div class="screen active" id="screen-decks">
  <div class="screen-title">Greek<br><span>Words</span></div>
  <div class="screen-sub">Выбери колоду для повторения</div>
  <div id="deck-list"></div>
</div>

<!-- ЭКРАН 2: КАРТОЧКИ -->
<div class="screen" id="screen-cards">
  <div class="top-bar">
    <div class="back-btn" onclick="goHome()">← Назад</div>
    <div class="round-badge" id="roundBadge">Раунд 1</div>
    <div class="counter" id="counter"></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="card-wrap" onclick="flip()">
    <div class="card-inner" id="cardInner">
      <div class="card-face front">
        <div class="front-text">
          <div class="word" id="wordEl"></div>
          <div class="tap-hint">нажми для перевода</div>
        </div>
        <div class="flip-btn">↩︎</div>
      </div>
      <div class="card-face back">
        <div class="translation" id="transEl"></div>
        <div class="original-back" id="origEl"></div>
      </div>
    </div>
  </div>

  <div class="btns" id="btns">
    <div class="btns-main">
      <button class="btn btn-again" onclick="answer('again')">
        <span class="btn-emoji">↺</span>Ещё раз
      </button>
      <button class="btn btn-ok" onclick="answer('ok')">
        <span class="btn-emoji">✓</span>Помню
      </button>
    </div>
    <div class="btn-star-wrap">
      <button class="btn-star" onclick="answer('star')">
        <span class="btn-star-label">★ В следующий раунд (рус → греч)</span>
      </button>
    </div>
  </div>
</div>

<!-- ЭКРАН 3: КОНЕЦ РАУНДА 1 -->
<div class="screen" id="screen-round1-end">
  <div class="round-end">
    <div class="round-end-emoji">🎯</div>
    <div class="round-end-title">Раунд 1 готов!</div>
    <div class="round-end-sub" id="round1-sub"></div>
    <button class="btn-primary" id="btn-start-round2" onclick="startRound2()">Перейти к рус → греч</button>
    <button class="btn-secondary" onclick="goHome()">На главную</button>
  </div>
</div>

<!-- ЭКРАН 4: ФИНАЛ -->
<div class="screen" id="screen-done">
  <div class="done-header">
    <div class="done-title">Выучено ★</div>
    <div class="back-btn" onclick="goHome()">← Назад</div>
  </div>
  <div class="done-sub" id="done-sub"></div>
  <div class="mastered-list" id="mastered-list"></div>
  <button class="btn-primary" style="margin-top:1.5rem;" onclick="goHome()">На главную</button>
</div>

<script>
if (window.Telegram?.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}

const DECKS = [
  {
    id: 'culture',
    name: 'Экзамен по культуре',
    desc: 'История и культура Кипра · 37 слов',
    words: [
      {w:"ανακοινώνω", t:"объявлять, сообщать"},
      {w:"αναλαμβάνω", t:"брать на себя, принимать"},
      {w:"ανασχηματισμός, ο", t:"перестановка в правительстве"},
      {w:"αντικατάσταση, η", t:"замена, замещение"},
      {w:"αξίωμα, το", t:"должность, звание"},
      {w:"αποχώρηση, η", t:"уход, выход"},
      {w:"αρμοδιότητα, η", t:"компетенция, полномочие"},
      {w:"αρχικός, -ή, -ό", t:"начальный, первоначальный"},
      {w:"ανώτατος, -η, -ο", t:"высший, верховный"},
      {w:"αναίρεση, η", t:"отмена, кассация"},
      {w:"ασκώ", t:"осуществлять, выполнять"},
      {w:"βουλή, η", t:"парламент (греческий)"},
      {w:"διεθνής, -ής, -ές", t:"международный"},
      {w:"διεξάγω", t:"проводить, осуществлять"},
      {w:"διορίζω", t:"назначать"},
      {w:"έδρα, η", t:"место в парламенте, мандат"},
      {w:"εκλογή, η", t:"выборы"},
      {w:"εκπροσωπώ", t:"представлять"},
      {w:"ελεγκτής, ο", t:"контролёр, аудитор"},
      {w:"επίσημα", t:"официально"},
      {w:"επίτροπος, ο/η", t:"уполномоченный, комиссар"},
      {w:"θεσμικός, -ή, -ό", t:"институциональный"},
      {w:"θητεία, η", t:"срок полномочий"},
      {w:"ισχύω", t:"действовать, иметь силу"},
      {w:"καθήκον, το", t:"обязанность, долг"},
      {w:"κάθε πότε", t:"как часто, время от времени"},
      {w:"κατώτερος, -η, -ο", t:"низший, нижестоящий"},
      {w:"κοινοβούλιο, το", t:"парламент"},
      {w:"κόμμα, το", t:"партия"},
      {w:"περιλαμβάνω", t:"включать, содержать"},
      {w:"πρόεδρος, ο/η", t:"президент, председатель"},
      {w:"προεδρικός, -ή, -ό", t:"президентский"},
      {w:"προσωρινός, -ή, -ό", t:"временный"},
      {w:"συνεχόμενος, -η, -ο", t:"последовательный, непрерывный"},
      {w:"υπεύθυνος, -η, -ο", t:"ответственный"},
      {w:"υπηρετώ", t:"служить, занимать должность"},
      {w:"υπουργός, ο", t:"министр"},
    ]
  }
];

let currentDeck = null;
let round = 1;
let deck = [];
let again = [];
let starWords = [];
let mastered = [];
let idx = 0;
let flipped = false;
let startTotal = 0;

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome() { showScreen('screen-decks'); }

function renderDecks() {
  const list = document.getElementById('deck-list');
  list.innerHTML = '';
  DECKS.forEach(d => {
    const el = document.createElement('div');
    el.className = 'deck-card';
    el.innerHTML = `
      <div>
        <div class="deck-name">${d.name}</div>
        <div class="deck-count">${d.desc}</div>
      </div>
      <div class="deck-arrow">›</div>
    `;
    el.onclick = () => startSession(d);
    list.appendChild(el);
  });
}

function startSession(deck_data) {
  currentDeck = deck_data;
  round = 1;
  deck = shuffle([...deck_data.words]);
  again = []; starWords = []; mastered = [];
  idx = 0; flipped = false;
  startTotal = deck.length;
  document.getElementById('roundBadge').textContent = 'греч → рус';
  showScreen('screen-cards');
  showCard();
}

function startRound2() {
  round = 2;
  deck = shuffle([...starWords]);
  again = []; idx = 0; flipped = false;
  startTotal = deck.length;
  document.getElementById('roundBadge').textContent = 'рус → греч';
  showScreen('screen-cards');
  showCard();
}

function showCard() {
  if (idx >= deck.length) {
    if (again.length > 0) {
      deck = shuffle(again); again = []; idx = 0;
    } else {
      endRound(); return;
    }
  }

  const c = deck[idx];
  const cardInner = document.getElementById('cardInner');
  const wasFlipped = cardInner.classList.contains('flipped');

  const front = round === 1 ? c.w : c.t;
  const back  = round === 1 ? c.t : c.w;
  const backSub = round === 1 ? c.w : c.t;

  document.getElementById('wordEl').textContent = front;
  cardInner.style.transition = 'none';
  cardInner.classList.remove('flipped');
  flipped = false;
  requestAnimationFrame(() => { cardInner.style.transition = ''; });
  updateProgress();

  if (wasFlipped) {
    setTimeout(() => {
      document.getElementById('transEl').textContent = back;
      document.getElementById('origEl').textContent = backSub;
    }, 460);
  } else {
    document.getElementById('transEl').textContent = back;
    document.getElementById('origEl').textContent = backSub;
  }
}

function flip() {
  if (flipped) return;
  flipped = true;
  document.getElementById('cardInner').classList.add('flipped');
  if (window.Telegram?.WebApp) window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
}

function answer(type) {
  const c = deck[idx];
  if (type === 'again') again.push(c);
  else if (type === 'star') {
    if (round === 1) starWords.push(c);
    else mastered.push(c);
  }
  if (window.Telegram?.WebApp) window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
  idx++;
  showCard();
}

function updateProgress() {
  const remaining = (deck.length - idx) + again.length;
  const done = startTotal - remaining;
  const pct = Math.round((Math.max(0, done) / startTotal) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('counter').textContent = idx + ' / ' + startTotal;
}

function endRound() {
  if (round === 1) {
    const sub = starWords.length > 0
      ? `Отлично знаешь ${starWords.length} сл. — готовы к раунду рус → греч.`
      : 'Нет слов для второго раунда. Попробуй ещё раз!';
    document.getElementById('round1-sub').textContent = sub;
    document.getElementById('btn-start-round2').style.display = starWords.length > 0 ? 'block' : 'none';
    showScreen('screen-round1-end');
  } else {
    document.getElementById('done-sub').textContent =
      `Отличная работа! Выучено: ${mastered.length} из ${currentDeck.words.length}`;
    const list = document.getElementById('mastered-list');
    list.innerHTML = '';
    mastered.forEach(c => {
      const el = document.createElement('div');
      el.className = 'mastered-item';
      el.innerHTML = `
        <div>
          <div class="mastered-word">${c.w}</div>
          <div class="mastered-trans">${c.t}</div>
        </div>
        <div class="mastered-star">★</div>`;
      list.appendChild(el);
    });
    showScreen('screen-done');
  }
}

function shuffle(arr) {
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

renderDecks();
</script>
</body>
</html>
