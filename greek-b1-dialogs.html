<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Греческий Б1 — Карточки для диалогов</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e0f;
  --surface: #161618;
  --surface2: #1e1e21;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #f0ede8;
  --muted: rgba(240,237,232,0.45);
  --accent: #c8f060;
  --accent2: #60d4f0;
  --accent3: #f060b0;
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  font-size: 15px;
  line-height: 1.65;
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(200,240,96,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(200,240,96,0.03) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}
.container { max-width: 1100px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }
header { padding: 72px 0 56px; position: relative; }
.header-label {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'Unbounded', sans-serif; font-size: 11px;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--accent); border: 1px solid rgba(200,240,96,0.3);
  padding: 6px 14px; border-radius: 40px; margin-bottom: 28px;
}
.header-label::before {
  content: ''; width: 6px; height: 6px;
  background: var(--accent); border-radius: 50%; animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.7)} }
h1 { font-family: 'Unbounded', sans-serif; font-size: clamp(32px,6vw,64px); font-weight: 700; line-height: 1.05; letter-spacing: -.02em; margin-bottom: 20px; }
h1 span.gr { color: var(--accent); display: block; }
.header-sub { font-size: 17px; color: var(--muted); max-width: 560px; line-height: 1.6; }
.header-deco { position: absolute; right: 0; top: 40px; font-family: 'Unbounded', sans-serif; font-size: clamp(80px,14vw,160px); font-weight: 700; color: rgba(200,240,96,0.04); line-height: 1; pointer-events: none; user-select: none; letter-spacing: -.04em; }
.meta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 32px; }
.badge { font-size: 12px; font-weight: 600; padding: 5px 14px; border-radius: 40px; border: 1px solid; letter-spacing: .04em; }
.badge-accent { border-color: rgba(200,240,96,.5); color: var(--accent); }
.badge-blue   { border-color: rgba(96,212,240,.4); color: var(--accent2); }
.badge-pink   { border-color: rgba(240,96,176,.4); color: var(--accent3); }
.social-link { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 5px 13px; border-radius: 40px; border: 1px solid; text-decoration: none; letter-spacing: .03em; transition: opacity .15s; white-space: nowrap; }
.social-link:hover { opacity: .72; }
.social-link.tg { border-color: rgba(96,212,240,.45); color: var(--accent2); }
.social-link.yt { border-color: rgba(240,80,80,.45); color: #f06060; }
.header-socials { position: absolute; right: 0; top: 72px; display: flex; gap: 10px; z-index: 2; }
.footer-inner { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; }
.tasks-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; padding-bottom: 80px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color .2s, transform .2s; cursor: pointer; }
.card:hover { border-color: var(--border2); transform: translateY(-2px); }
.card.open { border-color: var(--card-accent); }
.card-top { padding: 20px 22px 18px; display: flex; align-items: flex-start; gap: 14px; }
.card-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; background: var(--card-icon-bg); }
.card-title-block { flex: 1; }
.card-title { font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: -.01em; color: var(--text); margin-bottom: 4px; }
.card-hint { font-size: 12px; color: var(--muted); }
.card-toggle { width: 28px; height: 28px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px; color: var(--muted); transition: transform .25s, background .2s; }
.card.open .card-toggle { transform: rotate(45deg); background: var(--card-accent); color: #000; border-color: transparent; }
.card-body { display: none; padding: 0 22px 20px; animation: slideDown .2s ease; }
@keyframes slideDown { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
.card.open .card-body { display: block; }
.divider { height: 1px; background: var(--border); margin-bottom: 18px; }
.section-label { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.roles-split { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.role-block { background: var(--surface2); border-radius: 10px; padding: 14px 16px; border: 1px solid var(--border); }
.role-block-label { font-family: 'Unbounded', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--card-accent); margin-bottom: 8px; }
.role-block-text { font-size: 13px; line-height: 1.7; color: var(--text); }

/* shared expand button */
.expand-btn { display: flex; align-items: center; gap: 6px; margin-top: 12px; background: none; border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; font-size: 12px; color: var(--muted); cursor: pointer; font-family: 'Manrope', sans-serif; transition: border-color .15s, color .15s; width: 100%; text-align: left; }
.expand-btn:hover { border-color: var(--card-accent); color: var(--text); }
.expand-btn .arrow { transition: transform .2s; margin-left: auto; display: inline-block; }
.expand-btn.open .arrow { transform: rotate(180deg); }
.expand-content { display: none; margin-top: 8px; padding: 10px 12px 10px 14px; background: rgba(0,0,0,0.25); border-radius: 0 0 8px 8px; border-left: 2px solid var(--card-accent); }
.expand-content.open { display: block; }
.expand-content li { font-size: 13px; color: var(--text); line-height: 1.65; margin-bottom: 8px; list-style: none; padding-left: 18px; position: relative; }
.expand-content li::before { content: '→'; position: absolute; left: 0; color: var(--card-accent); font-size: 11px; top: 2px; }
.expand-content li:last-child { margin-bottom: 0; }

/* criteria block — different left border color */
.criteria-content { border-left-color: rgba(240,224,96,0.6); }
.criteria-content li::before { color: #f0e060; }
.criteria-btn { border-color: rgba(240,224,96,0.25); }
.criteria-btn:hover { border-color: #f0e060; }

.vocab-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.vocab-tag { font-size: 12px; padding: 4px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); letter-spacing: .01em; }

/* TRANSLATION POPUP */
#translate-popup { display: none; position: fixed; z-index: 9999; background: #17171a; border: 1px solid rgba(200,240,96,.5); border-radius: 10px; padding: 10px 14px; max-width: 360px; min-width: 120px; box-shadow: 0 6px 28px rgba(0,0,0,.6); pointer-events: none; }
#translate-popup .tpop-label { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 5px; }
#translate-popup .tpop-text { font-size: 14px; line-height: 1.55; color: var(--text); }
.tpop-loader { font-size: 12px; color: var(--muted); font-style: italic; }

footer { border-top: 1px solid var(--border); padding: 28px 0; text-align: center; font-size: 13px; color: var(--muted); position: relative; z-index: 1; }
</style>
</head>
<body>

<div id="translate-popup">
  <div class="tpop-label">Перевод</div>
  <div class="tpop-text" id="tpop-content"><span class="tpop-loader">переводим...</span></div>
</div>

<div class="container">
  <header>
    <div class="header-deco">Б1</div>
    <div class="header-socials">
      <a class="social-link tg" href="https://t.me/mathenoel" target="_blank">✈ Telegram</a>
      <a class="social-link yt" href="https://www.youtube.com/channel/UCl9rhSzwORE5APQO2LaGk1A" target="_blank">▶ YouTube</a>
    </div>
    <div class="header-label">Radio Greek</div>
    <h1>Ролевые<br><span class="gr">Диалоги</span></h1>
    <p class="header-sub">Карточки для парных диалогов. Выдели греческий текст — появится перевод.</p>
    <div class="meta">
      <span class="badge badge-accent">Уровень Б1</span>
      <span class="badge badge-blue">15 тем</span>
      <span class="badge badge-pink">Новогреческий</span>
    </div>
  </header>
  <div class="tasks-grid" id="grid"></div>
</div>

<footer>
  <div class="container">
    <div class="footer-inner">
      <span style="color:var(--muted)">Создано для <span style="color:var(--accent)">Radio Greek</span> · греческий с музыкой</span>
      <a class="social-link tg" href="https://t.me/mathenoel" target="_blank">✈ Telegram</a>
      <a class="social-link yt" href="https://www.youtube.com/channel/UCl9rhSzwORE5APQO2LaGk1A" target="_blank">▶ YouTube</a>
    </div>
  </div>
</footer>

<script>
const tasks = [
  {
    topic: "ΣΚΥΛΟΣ Ή ΓΑΤΑ;",
    titleRu: "Собака или кошка?",
    emoji: "🐾", accent: "#c8f060", iconBg: "rgba(200,240,96,0.1)",
    roleA: "Μιλάτε με τον φίλο / τη φίλη σας για κατοικίδια. Εσείς θέλετε να πάρετε σκύλο. Πιστεύετε ότι ο σκύλος είναι πιο φιλικός, σας κάνει να βγαίνετε έξω για περίπατο και είναι καλή παρέα. Ναι, χρειάζεται περισσότερη φροντίδα, αλλά αξίζει. Ο φίλος / Η φίλη σας όμως προτιμάει γάτα. Εξηγήστε τους λόγους σας.",
    criteriaA: ["Λέω γιατί προτιμώ σκύλο (π.χ. φιλικός, καλή παρέα)", "Αναφέρω τουλάχιστον 2 πλεονεκτήματα", "Απαντώ στα επιχειρήματα του άλλου", "Χρησιμοποιώ: πιστεύω ότι / νομίζω ότι / κατά τη γνώμη μου"],
    argsA: ["Ο σκύλος σε κάνει να βγαίνεις έξω κάθε μέρα — αυτό είναι καλό για την υγεία.", "Με σκύλο δεν νιώθεις μόνος/μόνη — είναι πάντα εκεί και χαίρεται όταν γυρίζεις σπίτι."],
    roleB: "Μιλάτε με τον φίλο / τη φίλη σας για κατοικίδια. Ο φίλος / Η φίλη σας θέλει σκύλο. Εσείς προτιμάτε γάτα — είναι πιο ανεξάρτητη, δεν χρειάζεται να βγαίνετε έξω κάθε μέρα και είναι πιο εύκολη στη φροντίδα. Επίσης δεν κάνει πολύ θόρυβο. Προσπαθείτε να πείσετε τον φίλο / τη φίλη σας.",
    criteriaB: ["Λέω γιατί προτιμώ γάτα (π.χ. ανεξάρτητη, ήσυχη)", "Αναφέρω τουλάχιστον 2 πλεονεκτήματα", "Αντικρούω τα επιχειρήματα του άλλου", "Χρησιμοποιώ: ναι, αλλά... / από την άλλη... / συμφωνώ ότι..., ωστόσο..."],
    argsB: ["Η γάτα δεν χρειάζεται περίπατο — μπορείς να λείπεις από το σπίτι χωρίς πρόβλημα.", "Η γάτα είναι πιο ήσυχη και δεν ενοχλεί τους γείτονες."],
    vocab: ["κατοικίδιο", "φροντίδα", "περίπατος", "ανεξάρτητος", "παρέα", "αξίζει"]
  },
  {
    topic: "ΠΡΩΙΝΟ ΞΥΠΝΗΜΑ Ή ΑΡΓΟ ΞΥΠΝΗΜΑ;",
    titleRu: "Рано вставать или поздно?",
    emoji: "⏰", accent: "#f0a060", iconBg: "rgba(240,160,96,0.1)",
    roleA: "Μιλάτε με τον συγκάτοικό σας για το πρόγραμμα του σπιτιού. Εσείς σηκώνεστε νωρίς — στις 6:30. Πιστεύετε ότι το πρωί είναι η πιο παραγωγική ώρα της ημέρας. Προλαβαίνετε πολλά πριν ξεκινήσει η μέρα και νιώθετε πιο ενεργητικοί. Ο συγκάτοικός σας όμως κοιμάται αργά. Εξηγήστε τα οφέλη.",
    criteriaA: ["Εξηγώ τα οφέλη του νωρίς ξυπνήματος", "Λέω συγκεκριμένη ώρα (6:30) και τι προλαβαίνω", "Προτείνω λύση για να μη ενοχλώ τον συγκάτοικο", "Χρησιμοποιώ: για μένα / νιώθω ότι / αν σηκωθείς νωρίς..."],
    argsA: ["Το πρωί είναι ήσυχα — μπορείς να συγκεντρωθείς και να κάνεις πολλά πράγματα.", "Όταν σηκώνεσαι νωρίς, έχεις χρόνο για πρωινό και δεν βιάζεσαι."],
    roleB: "Μιλάτε με τον συγκάτοικό σας για το πρόγραμμα. Ο συγκάτοικός σας σηκώνεται στις 6:30 και κάνει πολύ θόρυβο. Εσείς κοιμάστε αργά γιατί εργάζεστε το βράδυ και είστε πιο δημιουργικοί τη νύχτα. Πιστεύετε ότι κάθε άνθρωπος έχει διαφορετικό ρυθμό. Ζητάτε να βρείτε μια λύση που να βολεύει και τους δύο.",
    criteriaB: ["Εξηγώ γιατί κοιμάμαι αργά (δουλειά βράδυ, ρυθμός)", "Παραπονιέμαι για τον θόρυβο αλλά με ευγένεια", "Προτείνω συμβιβασμό / κοινή λύση", "Χρησιμοποιώ: καταλαβαίνω, αλλά... / μήπως μπορούμε να..."],
    argsB: ["Η δουλειά μου τελειώνει αργά — αν κοιμηθώ νωρίς, δεν αποδίδω καλά.", "Κάθε άνθρωπος έχει διαφορετικό βιολογικό ρολόι — δεν μπορούμε όλοι να κάνουμε το ίδιο."],
    vocab: ["ξυπνώ", "κοιμάμαι", "παραγωγικός", "ρυθμός", "δημιουργικός", "βολεύει"]
  },
  {
    topic: "ΒΙΒΛΙΟ Ή PODCAST;",
    titleRu: "Книга или подкаст?",
    emoji: "🎧", accent: "#a060f0", iconBg: "rgba(160,96,240,0.1)",
    roleA: "Μιλάτε με τον φίλο / τη φίλη σας για τρόπους να μαθαίνετε νέα πράγματα. Εσείς προτιμάτε να διαβάζετε βιβλία. Πιστεύετε ότι το βιβλίο σας βοηθάει να συγκεντρωθείτε καλύτερα και να θυμάστε περισσότερα. Επίσης, σας αρέσει η αίσθηση ενός βιβλίου στα χέρια σας. Ο φίλος / Η φίλη σας προτιμάει podcast. Εξηγήστε γιατί.",
    criteriaA: ["Εξηγώ γιατί προτιμώ βιβλίο (συγκέντρωση, μνήμη)", "Αναφέρω τουλάχιστον 2 λόγους", "Ρωτώ τη γνώμη του άλλου και αντιδρώ", "Χρησιμοποιώ: κατά τη γνώμη μου / έχω την εντύπωση ότι"],
    argsA: ["Όταν διαβάζεις βιβλίο, δεν υπάρχουν διαφημίσεις και τίποτα δεν σε διακόπτει.", "Το βιβλίο σε αναγκάζει να σταματήσεις και να σκεφτείς — δεν μπορείς να το βάλεις σε γρήγορη αναπαραγωγή."],
    roleB: "Μιλάτε με τον φίλο / τη φίλη σας για τρόπους να μαθαίνετε νέα πράγματα. Ο φίλος / Η φίλη σας διαβάζει βιβλία. Εσείς προτιμάτε podcast — μπορείτε να ακούτε ενώ οδηγείτε, κάνετε γυμναστική ή μαγειρεύετε. Δεν χρειάζεστε να κάθεστε ακίνητοι. Επίσης υπάρχουν podcast για κάθε θέμα. Προσπαθείτε να πείσετε τον φίλο / τη φίλη σας.",
    criteriaB: ["Εξηγώ το κύριο πλεονέκτημα: ακούω ενώ κάνω άλλα πράγματα", "Δίνω παραδείγματα (οδήγηση, γυμναστική, μαγείρεμα)", "Αντικρούω την άποψη για τα βιβλία ευγενικά", "Χρησιμοποιώ: από την άλλη / δεν συμφωνώ ακριβώς γιατί..."],
    argsB: ["Με podcast μαθαίνεις πράγματα χωρίς να χάνεις χρόνο — ακούς ενώ κάνεις άλλα.", "Πολλά podcast έχουν ειδικούς που μιλούν απλά — πιο εύκολο να καταλάβεις από ένα βαρύ βιβλίο."],
    vocab: ["podcast", "συγκεντρώνομαι", "θυμάμαι", "ακίνητος", "οδηγώ", "θέμα"]
  },
  {
    topic: "ΠΟΔΗΛΑΤΟ Ή ΑΥΤΟΚΙΝΗΤΟ;",
    titleRu: "Велосипед или машина?",
    emoji: "🚲", accent: "#60d4f0", iconBg: "rgba(96,212,240,0.1)",
    roleA: "Μιλάτε με τον συνάδελφό σας για τον τρόπο μετακίνησης στη δουλειά. Εσείς πάτε με ποδήλατο. Είναι υγιεινό, φτηνό και καλό για το περιβάλλον. Επίσης αποφεύγετε την κίνηση. Ο συνάδελφός σας όμως πάει με αυτοκίνητο. Εξηγήστε γιατί προτιμάτε το ποδήλατο.",
    criteriaA: ["Αναφέρω 3 λόγους: υγεία, κόστος, περιβάλλον", "Εξηγώ ότι αποφεύγω την κίνηση", "Αντιμετωπίζω το επιχείρημα ότι αργώ", "Χρησιμοποιώ: ναι, έχεις δίκιο, αλλά... / από την άλλη πλευρά..."],
    argsA: ["Με ποδήλατο δεν ψάχνεις πάρκινγκ και δεν κολλάς στην κίνηση.", "Κάνεις γυμναστική κάθε μέρα χωρίς να πληρώνεις γυμναστήριο."],
    roleB: "Μιλάτε με τον συνάδελφό σας για τον τρόπο μετακίνησης. Ο συνάδελφός σας πηγαίνει με ποδήλατο. Εσείς πηγαίνετε με αυτοκίνητο γιατί είναι πιο γρήγορο, πιο άνετο και μπορείτε να πάτε παντού. Ειδικά όταν βρέχει ή κουβαλάτε πράγματα.",
    criteriaB: ["Αναφέρω 2-3 λόγους: ταχύτητα, άνεση, κάθε καιρό", "Δίνω παράδειγμα (βροχή, πράγματα)", "Ακούω και σχολιάζω τα επιχειρήματα του άλλου", "Χρησιμοποιώ: για μένα / αυτό που με ενοχλεί με το ποδήλατο είναι..."],
    argsB: ["Με αυτοκίνητο φτάνεις παντού — ακόμα και σε μέρη που δεν έχει δρόμο για ποδήλατο.", "Όταν βρέχει ή κάνει πολλή ζέστη, το αυτοκίνητο είναι πολύ πιο άνετο."],
    vocab: ["μετακίνηση", "κίνηση", "περιβάλλον", "πρακτικός", "κουβαλώ", "αποφεύγω"]
  },
  {
    topic: "ΜΕΝΟΥΜΕ ΣΤΗΝ ΠΟΛΗ Ή ΦΕΥΓΟΥΜΕ ΕΞΩ;",
    titleRu: "Жить в городе или за городом?",
    emoji: "🏙️", accent: "#f060b0", iconBg: "rgba(240,96,176,0.1)",
    roleA: "Μιλάτε με τον σύντροφό σας για το πού να ζήσετε. Εσείς θέλετε να μείνετε στην πόλη. Όλα είναι κοντά — δουλειά, καταστήματα, νοσοκομεία, φίλοι. Πιστεύετε ότι η ζωή στην πόλη είναι πιο βολική και ενδιαφέρουσα. Ο σύντροφός σας θέλει να φύγετε στα προάστια. Εξηγήστε γιατί δεν θέλετε.",
    criteriaA: ["Αναφέρω 3+ λόγους για ζωή στην πόλη", "Αντιμετωπίζω τα επιχειρήματα για προάστια", "Δείχνω ότι ακούω τον σύντροφό μου", "Χρησιμοποιώ: θεωρώ ότι / είναι σημαντικό για μένα να..."],

/* ── TRANSLATION ON SELECTION via MyMemory API (no CORS) ── */
const popup = document.getElementById('translate-popup');
const popupContent = document.getElementById('tpop-content');
let translateTimer = null;
let lastTranslated = '';

document.addEventListener('mouseup', (e) => {
  if (popup.contains(e.target)) return;
  const sel = window.getSelection();
  const text = sel ? sel.toString().trim() : '';
  if (!text || text.length < 2) { hidePopup(); return; }
  if (text === lastTranslated) return;
  const range = sel.getRangeAt(0);
  const rect = range.getBoundingClientRect();
  showPopup(rect, text);
});

document.addEventListener('mousedown', (e) => {
  if (!popup.contains(e.target)) hidePopup();
});

function showPopup(rect, text) {
  lastTranslated = text;
  popupContent.innerHTML = '<span class="tpop-loader">переводим...</span>';
  popup.style.display = 'block';
  popup.style.transform = 'none';

  const popW = 280;
  const margin = 8;

  // Position near the selection midpoint
  let left = rect.left + rect.width / 2 - popW / 2;
  left = Math.max(margin, Math.min(left, window.innerWidth - popW - margin));

  // Try above first, fall back to below
  const spaceAbove = rect.top;
  const popH = 70; // estimated
  let top;
  if (spaceAbove > popH + margin) {
    top = rect.top + window.scrollY - popH - margin;
  } else {
    top = rect.bottom + window.scrollY + margin;
  }

  popup.style.left = left + 'px';
  popup.style.top = top + 'px';

  clearTimeout(translateTimer);
  translateTimer = setTimeout(() => doTranslate(text), 400);
}

function hidePopup() {
  popup.style.display = 'none';
  lastTranslated = '';
  clearTimeout(translateTimer);
}

async function doTranslate(text) {
  try {
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=el|ru`;
    const res = await fetch(url);
    const data = await res.json();
    const t = data?.responseData?.translatedText;
    popupContent.textContent = (t && t !== text) ? t : '—';
  } catch {
    popupContent.textContent = 'Ошибка перевода';
  }
}
